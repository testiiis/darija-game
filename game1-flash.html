<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash Cards — Darija</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #C1272D; --green: #006233; --gold: #D4A017;
    --sand: #F5E6C8; --cream: #FDF6E3; --dark: #1A0A00;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Lato', sans-serif; background: var(--cream); min-height: 100vh; }

  nav {
    background: var(--red);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .nav-back {
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.8;
  }
  .nav-back:hover { opacity: 1; }
  .nav-title {
    color: white;
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    flex: 1;
    text-align: center;
  }
  .nav-score {
    background: rgba(255,255,255,0.2);
    color: white;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 700;
  }

  .game-area {
    max-width: 600px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  /* PROGRESS */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }
  .progress-bar {
    flex: 1;
    height: 6px;
    background: #e8dcc8;
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--red), var(--gold));
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .progress-label { font-size: 13px; color: #999; min-width: 50px; text-align: right; }

  /* CARD */
  .card-scene {
    perspective: 1000px;
    height: 280px;
    margin-bottom: 28px;
    cursor: pointer;
  }
  .card-3d {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s ease;
  }
  .card-3d.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    text-align: center;
  }

  .card-front {
    background: linear-gradient(145deg, var(--red), #8B1A1F);
    color: white;
    box-shadow: 0 8px 32px rgba(193,39,45,0.3);
  }
  .card-back {
    background: linear-gradient(145deg, #fff, #fdf6e3);
    transform: rotateY(180deg);
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    border: 2px solid var(--gold);
  }

  .card-hint {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.6;
    margin-bottom: 20px;
  }
  .card-word {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .card-phonetic {
    font-size: 16px;
    opacity: 0.7;
    font-style: italic;
  }
  .card-arabic {
    font-family: 'Amiri', serif;
    font-size: 32px;
    color: var(--gold);
    margin-bottom: 8px;
  }
  .card-translation {
    font-size: 28px;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 8px;
  }
  .card-example {
    font-size: 14px;
    color: #777;
    font-style: italic;
    line-height: 1.5;
  }
  .flip-hint {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    margin-top: 20px;
    letter-spacing: 1px;
  }

  /* CATEGORY TABS */
  .categories {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .cat-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1.5px solid #ddd;
    background: white;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    color: #777;
  }
  .cat-btn.active { background: var(--red); color: white; border-color: var(--red); }

  /* BUTTONS */
  .action-row {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
  }
  .btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-wrong { background: #FFE8E8; color: var(--red); }
  .btn-correct { background: #E8F5E8; color: var(--green); }
  .btn-wrong:hover { background: var(--red); color: white; }
  .btn-correct:hover { background: var(--green); color: white; }
  .btn-next {
    width: 100%;
    padding: 16px;
    background: var(--red);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: none;
  }
  .btn-next:hover { background: #9a1f24; }

  /* STATS */
  .stats-row {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }
  .stat {
    flex: 1;
    text-align: center;
    background: white;
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .stat-num { font-size: 26px; font-weight: 700; }
  .stat-label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }

  /* CONGRATS */
  .congrats {
    text-align: center;
    padding: 60px 20px;
    display: none;
  }
  .congrats h2 { font-family: 'Playfair Display', serif; font-size: 32px; margin-bottom: 12px; color: var(--green); }
  .congrats p { font-size: 17px; color: #777; margin-bottom: 28px; }
  .btn-restart { background: var(--green); color: white; border: none; padding: 16px 40px; border-radius: 30px; font-size: 16px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-back">← Accueil</a>
  <span class="nav-title">🃏 Flash Cards</span>
  <span class="nav-score" id="scoreDisplay">0 pts</span>
</nav>

<div class="game-area" id="gameArea">
  <div class="categories" id="categories"></div>

  <div class="progress-row">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0/0</div>
  </div>

  <div class="card-scene" onclick="flipCard()">
    <div class="card-3d" id="card3d">
      <div class="card-face card-front">
        <div class="card-hint">🇫🇷 En français</div>
        <div class="card-word" id="cardWord">—</div>
        <div class="card-phonetic" id="cardPhonetic"></div>
        <div class="flip-hint">Clique pour retourner →</div>
      </div>
      <div class="card-face card-back">
        <div class="card-hint">Darija 🇲🇦</div>
        <div class="card-arabic" id="cardArabic"></div>
        <div class="card-translation" id="cardDarija">—</div>
        <div class="card-example" id="cardExample"></div>
      </div>
    </div>
  </div>

  <div class="action-row" id="actionRow" style="display:none">
    <button class="btn btn-wrong" onclick="markResult(false)">❌ Je ne savais pas</button>
    <button class="btn btn-correct" onclick="markResult(true)">✅ Je savais !</button>
  </div>
  <button class="btn-next" id="btnNext" onclick="nextCard()">Carte suivante →</button>

  <div class="stats-row">
    <div class="stat">
      <div class="stat-num" id="statCorrect" style="color:var(--green)">0</div>
      <div class="stat-label">Bonnes</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statWrong" style="color:var(--red)">0</div>
      <div class="stat-label">À revoir</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statStreak" style="color:var(--gold)">0</div>
      <div class="stat-label">Série</div>
    </div>
  </div>
</div>

<div class="congrats" id="congrats">
  <div style="font-size:64px;margin-bottom:16px">🎉</div>
  <h2>Bravo !</h2>
  <p id="congratsMsg">Tu as terminé toutes les cartes !</p>
  <button class="btn-restart" onclick="restartGame()">Recommencer</button>
</div>

<script>
const cards = {
  salutations: [
    { fr: "Bonjour / Salut", darija: "Salam / Salamo 3alaykom", arabic: "سلام", example: "Salam ! Labas ?" },
    { fr: "Bonjour (le matin)", darija: "Sbah lkhir", arabic: "صباح الخير", example: "Sbah lkhir ! Sbah noor !" },
    { fr: "Comment tu vas ?", darija: "Labas ? / Mezyan ?", arabic: "لاباس؟", example: "Labas 3lik ?" },
    { fr: "Je vais bien (merci à Dieu)", darija: "Ana bikhir, lhamdolah", arabic: "بخير الحمدلله", example: "Bikhir, lhamdolah. Nta ?" },
    { fr: "Tout va bien ?", darija: "Wach kolchi labas ?", arabic: "واش كلشي لاباس؟", example: "Kolchi labas, lhamdolah !" },
    { fr: "Comment tu t'appelles ?", darija: "Chno smitek ?", arabic: "شنو سميتك؟", example: "Chno smitek ? — Smiti Youssef." },
    { fr: "D'où tu viens ?", darija: "Mnin nta / nti ?", arabic: "منين نت؟", example: "Ana man Fransa. Nta ?" },
  ],
  verbes: [
    { fr: "Aller", darija: "Mcha (irrégulier)", arabic: "مشى", example: "Mchit L hammam lbareh." },
    { fr: "Manger", darija: "Kla (irrégulier)", arabic: "كلا", example: "Klit laftor diali." },
    { fr: "Cuisinier", darija: "Tiyeb (régulier)", arabic: "طيّب", example: "Tiyebna f lkozina." },
    { fr: "Travailler", darija: "Khdam (régulier)", arabic: "خدم", example: "Khdamt mzyan lyoma." },
    { fr: "Parler", darija: "Hdar (régulier)", arabic: "هضر", example: "Hdarti m3a smiti ?" },
    { fr: "Voir", darija: "Shaf (irrégulier)", arabic: "شاف", example: "Chaft film mezyan." },
    { fr: "Aller à la plage", darija: "Mcha L bhar", arabic: "مشى للبحر", example: "Mchina L bhar f weekend." },
    { fr: "Nager", darija: "3am (irrégulier)", arabic: "عام", example: "3amna f lbhar." },
    { fr: "Jouer", darija: "L3ab (irrégulier)", arabic: "لعب", example: "L3abna lkora." },
    { fr: "S'habiller", darija: "Lbas (irrégulier)", arabic: "لبس", example: "Lbasna hwayji." },
  ],
  vocabulaire: [
    { fr: "La famille", darija: "L3a'ila", arabic: "العائلة", example: "Ki dayra l3a'iltek ?" },
    { fr: "Le travail", darija: "Lkhadma", arabic: "الخدمة", example: "Lkhadma ghada mezyan." },
    { fr: "Le matin", darija: "Ssbah / nhar", arabic: "الصباح", example: "Nadna bakri f ssbah." },
    { fr: "Le café", darija: "Lqahwa", arabic: "القهوة", example: "Chrabt lqahwa diali." },
    { fr: "Le petit-déjeuner", darija: "Laftor", arabic: "الفطور", example: "Klat laftor dyalha." },
    { fr: "Les vêtements", darija: "Hwayej", arabic: "الهوايج", example: "Lbasna hwayji o mchina." },
    { fr: "Le sac", darija: "Shkara", arabic: "الشكارة", example: "Jma3t shkara dyali." },
    { fr: "La semaine", darija: "Simana", arabic: "السيمانة", example: "Simana kolha khadamt." },
    { fr: "La plage", darija: "Lbhar", arabic: "البحر", example: "Mchina L bhar f weekend." },
    { fr: "Les amis", darija: "Sshab / Ssahb", arabic: "الصحاب", example: "Khrojt m3a sshabi." },
  ]
};

let currentCategory = 'salutations';
let deck = [];
let currentIndex = 0;
let score = 0;
let correct = 0;
let wrong = 0;
let streak = 0;
let flipped = false;

function buildCategories() {
  const cats = { salutations: '🌙 Salutations', verbes: '⚡ Verbes', vocabulaire: '📚 Vocabulaire' };
  const div = document.getElementById('categories');
  Object.entries(cats).forEach(([key, label]) => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (key === currentCategory ? ' active' : '');
    btn.textContent = label;
    btn.onclick = () => switchCat(key);
    div.appendChild(btn);
  });
}

function switchCat(cat) {
  currentCategory = cat;
  document.querySelectorAll('.cat-btn').forEach((b, i) => {
    b.className = 'cat-btn' + (Object.keys({salutations:1,verbes:1,vocabulaire:1})[i] === cat ? ' active' : '');
  });
  startGame();
}

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function startGame() {
  deck = shuffle(cards[currentCategory]);
  currentIndex = 0;
  correct = 0; wrong = 0; streak = 0;
  document.getElementById('congrats').style.display = 'none';
  document.getElementById('gameArea').style.display = 'block';
  showCard();
}

function showCard() {
  if (currentIndex >= deck.length) { showCongrats(); return; }
  const c = deck[currentIndex];
  flipped = false;
  document.getElementById('card3d').classList.remove('flipped');
  document.getElementById('cardWord').textContent = c.fr;
  document.getElementById('cardPhonetic').textContent = '';
  document.getElementById('cardDarija').textContent = c.darija;
  document.getElementById('cardArabic').textContent = c.arabic;
  document.getElementById('cardExample').textContent = '« ' + c.example + ' »';
  document.getElementById('actionRow').style.display = 'none';
  document.getElementById('btnNext').style.display = 'none';
  updateProgress();
  updateStats();
}

function flipCard() {
  if (flipped) return;
  flipped = true;
  document.getElementById('card3d').classList.add('flipped');
  setTimeout(() => {
    document.getElementById('actionRow').style.display = 'flex';
  }, 400);
}

function markResult(isCorrect) {
  if (isCorrect) { correct++; streak++; score += 10 * streak; }
  else { wrong++; streak = 0; }
  document.getElementById('actionRow').style.display = 'none';
  document.getElementById('btnNext').style.display = 'block';
  updateStats();
  updateScoreDisplay();
}

function nextCard() {
  currentIndex++;
  showCard();
}

function updateProgress() {
  const pct = Math.round(currentIndex / deck.length * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = currentIndex + '/' + deck.length;
}

function updateStats() {
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statStreak').textContent = streak;
}

function updateScoreDisplay() {
  document.getElementById('scoreDisplay').textContent = score + ' pts';
  const xp = parseInt(localStorage.getItem('darija_xp') || '0') + (score - (parseInt(localStorage.getItem('flash_score') || '0')));
  localStorage.setItem('flash_score', score);
  localStorage.setItem('darija_xp', Math.max(0, xp));
}

function showCongrats() {
  document.getElementById('gameArea').style.display = 'none';
  const c = document.getElementById('congrats');
  c.style.display = 'block';
  const pct = Math.round(correct / deck.length * 100);
  document.getElementById('congratsMsg').textContent =
    `${correct}/${deck.length} bonnes réponses — ${pct}% de réussite ! +${score} points`;
}

function restartGame() { startGame(); }

buildCategories();
startGame();
</script>
</body>
</html>
